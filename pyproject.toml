[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brendarter-lorapeft_jd122"
version = "0.1.0"
description = "从样本里推断LoRA 与参数高效微调研究员·训练数据配比与课程学习应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "brendarter" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://brendarter.github.io"
Repository = "https://github.com/brendarter/lorapeft_jd122"
Issues = "https://github.com/brendarter/lorapeft_jd122/issues"

[project.scripts]
lorapeft_jd122 = "lorapeft_jd122:main"

[tool.setuptools]
py-modules = ["lorapeft_jd122"]
